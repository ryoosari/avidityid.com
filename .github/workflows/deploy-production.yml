name: Build and Deploy to Production

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run content validation
        run: npm run validate-content
        
      - name: Process content
        run: npm run process-content
        
      - name: Run TypeScript check
        run: npm run type-check
        
      - name: Run linting
        run: npm run lint
        
      - name: Build static site
        run: npm run static-export
        env:
          NEXT_PUBLIC_STATIC_EXPORT: true
          
      - name: Copy .htaccess to output
        run: cp .htaccess out/.htaccess
        
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: out/
          
      - name: Deploy to production branch
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          
          # Clone the repository with production branch
          git clone --branch production https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git production-repo || git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git production-repo
          
          cd production-repo
          
          # Create production branch if it doesn't exist
          git checkout production 2>/dev/null || git checkout -b production
          
          # Clear existing files (except .git)
          find . -mindepth 1 -name '.git' -prune -o -type f -delete
          find . -mindepth 1 -name '.git' -prune -o -type d -empty -delete
          
          # Copy new build files
          cp -r ../out/* .
          
          # Add all files
          git add .
          
          # Commit and push if there are changes
          git diff --staged --quiet || (git commit -m "Deploy build from commit ${{ github.sha }}" && git push origin production)
          
      - name: Notify deployment status
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Deployment successful!"
          else
            echo "❌ Deployment failed!"
          fi 